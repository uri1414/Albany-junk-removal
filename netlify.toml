# Netlify configuration for Albany Junk Removal
# Static HTML site at the repo root — no build step.
[build]
  publish = "."
  command = ""

# Canonical host: force www -> apex (non-www), matching every page's
# <link rel="canonical"> and og:url. Consolidates link/ranking signals onto one
# hostname. (http -> https is handled by Netlify's "Force HTTPS" domain setting.)
[[redirects]]
  from = "https://www.albanyjunkremoval.org/*"
  to = "https://albanyjunkremoval.org/:splat"
  status = 301
  force = true

# Long-cache fingerprint-free static assets. Images/CSS/JS are versioned by
# filename (or ?v= query), so a year-long immutable cache is safe; when an
# asset changes, its URL changes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
